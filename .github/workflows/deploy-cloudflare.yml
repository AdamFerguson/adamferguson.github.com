# Deploys the static build to Cloudflare Pages.
#
# Secrets (never in this repo — see GitHub → Settings → Secrets and variables):
#   CLOUDFLARE_API_TOKEN   API token, minimal scope: Account → Cloudflare Pages → Edit
#   CLOUDFLARE_ACCOUNT_ID  your account UUID (cf-api.com/dashboard → account)
#
# Safety:
#   - The token is referenced via ${{ secrets.* }} only; GitHub masks it in logs.
#   - `wrangler` is a pinned devDependency (package-lock), not an unpinned npx fetch.
#   - The deploy job runs only on pushes to the default branch (master); pull
#     requests build but can never deploy.
#   - The job requests only `contents: read`.
#
# The legacy GitHub Pages workflow (deploy.yml) stays in place until the DNS
# cutover is verified; delete it then for a clean rollback path.

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Validate resume YAML
        run: npm run validate:resume

      - name: Build
        run: npm run build

      - name: Render resume PDF
        run: |
          npx playwright install --with-deps chromium
          npm run pdf

      - name: Copy PDF into build output
        # The PDF is rendered into public/ after the build ran; copy it into
        # dist/ so it's part of the deploy (served at /AdamFerguson-Resume.pdf).
        run: cp public/AdamFerguson-Resume.pdf dist/AdamFerguson-Resume.pdf

      - name: Verify dist output
        run: |
          test -f dist/index.html
          test -f dist/resume/index.html
          test -f dist/AdamFerguson-Resume.pdf
          echo "dist verified"

      - name: Design-system gate (token audit)
        # Deterministic: raw colors outside themes.css, Tier-1 token leaks,
        # unevaluated calls in built HTML, WCAG contrast. Fails the deploy on violation.
        run: node .pi/skills/website-design/scripts/token-audit.mjs

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Ensure Pages project exists
        # wrangler 4.x does not auto-create projects on deploy. First run creates
        # it; later runs are a no-op.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx wrangler pages project list | grep -q adam-ferguson; then
            npx wrangler pages project create adam-ferguson --production-branch master
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=adam-ferguson
