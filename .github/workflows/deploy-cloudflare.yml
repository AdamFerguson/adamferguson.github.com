# Deploys the static build to Cloudflare Workers (static assets).
#
# The build output (dist/) ships as the Worker's `assets` namespace — served
# edge-cached from every PoP. Requests that match an asset never execute the
# Worker script; worker.js only runs for unmatched routes (404 → dist/404.html)
# and is the seam for future dynamic routes.
#
# Secrets (never in this repo — see GitHub → Settings → Secrets and variables):
#   CLOUDFLARE_API_TOKEN   API token, scopes: Account → Workers → Edit and
#                         Zone (adam-ferguson.com) → DNS → Edit (the cutover
#                         step removes legacy records; no-op afterwards)
#   CLOUDFLARE_ACCOUNT_ID  your account UUID (cf-api.com/dashboard → account)
#
# Safety:
#   - The token is referenced via ${{ secrets.* }} only; GitHub masks it in logs.
#   - `wrangler` is a pinned devDependency (package-lock), not an unpinned npx fetch.
#   - The deploy job runs only on pushes to the default branch (master); pull
#     requests build but can never deploy.
#   - The job requests only `contents: read`.
#
# DNS cutover:
#   Declared in wrangler.jsonc (routes: custom_domain for apex + www) —
#   `wrangler deploy` attaches the custom domains and Cloudflare provisions
#   the DNS records itself; the "Remove legacy DNS records" step clears the
#   Pages-era CNAMEs exactly once (guarded no-op afterwards).
#   ROLLED BACK (cutover done 2026-08-22): the legacy records were
#   CNAME adam-ferguson.com -> adam-ferguson.pages.dev (proxied) and
#   CNAME www.adam-ferguson.com -> adam-ferguson.pages.dev (proxied),
#   captured in the deploy job log of the cutover run.
#   Rollback procedure: re-add those two CNAMEs (zone DNS) and remove the
#   routes from wrangler.jsonc + redeploy (or delete the custom domains in
#   the dashboard). The Pages project itself stays up until you delete it.

name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Validate resume YAML
        run: npm run validate:resume

      - name: Build
        run: npm run build

      - name: Render résumé PDF and DOCX
        run: |
          npx playwright install --with-deps chromium
          npm run pdf
          # DOCX is rendered via pandoc. The ubuntu runner image no longer
          # ships it, so install the apt package first (printed for diagnosing
          # version issues).
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc
          pandoc --version
          npm run docx

      - name: Copy résumé files into build output
        # Both are rendered into public/ after the build ran; copy them into
        # dist/ so they're part of the deploy (served at /AdamFerguson-Resume.pdf
        # and /AdamFerguson-Resume.docx).
        run: |
          cp public/AdamFerguson-Resume.pdf dist/AdamFerguson-Resume.pdf
          cp public/AdamFerguson-Resume.docx dist/AdamFerguson-Resume.docx

      - name: Verify dist output
        run: |
          test -f dist/index.html
          test -f dist/resume/index.html
          test -f dist/AdamFerguson-Resume.pdf
          test -f dist/AdamFerguson-Resume.docx
          echo "dist verified"

      - name: Design-system gate (token audit)
        # Deterministic: raw colors outside themes.css, Tier-1 token leaks,
        # unevaluated calls in built HTML, WCAG contrast. Fails the deploy on violation.
        run: node .pi/skills/website-design/scripts/token-audit.mjs

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    steps:
      - name: Checkout
        # Required so wrangler.jsonc + worker.js exist; without them wrangler
        # falls back to onboarding defaults (first deploy landed on a stray
        # worker named after the checkout directory).
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install dependencies
        # Uses the pinned wrangler from package-lock, not an unpinned npx fetch.
        run: npm ci

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: "Remove legacy DNS records for the cutover (idempotent)"
        # Cloudflare refuses to attach a Worker custom domain while externally
        # managed records (the Pages-era A records) exist at the hostname
        # (error 100117). This first checks the worker's domain store — once
        # the cutover has happened it is a no-op on every future deploy —
        # otherwise captures the apex + www A/AAAA/CNAME records and deletes
        # them so `wrangler deploy` can attach the custom domains and
        # Cloudflare provisions its own records. Everything deleted is
        # printed first, so a failed cutover is rolled back by recreating
        # those values (or by re-pointing DNS at the still-existing Pages
        # project).
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PYEOF' || echo "legacy-record step reported an error — see log above"
          import json, os, sys, urllib.request, urllib.error

          token = os.environ["CLOUDFLARE_API_TOKEN"]
          api = "https://api.cloudflare.com/client/v4"
          hosts = ("adam-ferguson.com", "www.adam-ferguson.com")

          def call(method, path, body=None):
              req = urllib.request.Request(
                  api + path, method=method,
                  data=json.dumps(body).encode() if body else None,
                  headers={"Authorization": f"Bearer {token}",
                           "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return {"ok": True, "resp": json.load(r)}
              except urllib.error.HTTPError as e:
                  return {"ok": False, "http": e.code, "body": e.read().decode()[:300]}

          # Guard: if the custom domains are already attached to the worker,
          # this step is a no-op forever after (safe on every future deploy).
          wd = call("GET", "/accounts/%s/workers/scripts/adam-ferguson/domains/records" % os.environ["CLOUDFLARE_ACCOUNT_ID"])
          print("worker domain records:", json.dumps(wd)[:500])
          if wd["ok"] and "adam-ferguson.com" in json.dumps(wd["resp"].get("result", [])):
              print("custom domain already attached to the worker — nothing to do")
              sys.exit(0)

          z = call("GET", "/zones?name=adam-ferguson.com")
          if not z["ok"] or not z["resp"].get("result"):
              print("NO ZONE ACCESS via this token:", json.dumps(z)[:300])
              print("Manual step: cf-api.com -> adam-ferguson.com -> DNS -> delete the A records for @ and www, then re-run this workflow.")
              sys.exit(0)
          zone = z["resp"]["result"][0]["id"]
          print("zone:", zone)

          removed = 0
          for host in hosts:
              cur = call("GET", f"/zones/{zone}/dns_records?name={host}")
              if not cur["ok"]:
                  print("record list failed:", json.dumps(cur)[:300]); continue
              for rec in cur["resp"].get("result", []):
                  if rec["type"] in ("A", "AAAA", "CNAME"):
                      print("LEGACY (capture for rollback):",
                            json.dumps({k: rec[k] for k in ("type", "name", "content", "proxied", "id")}))
                      d = call("DELETE", f"/zones/{zone}/dns_records/{rec['id']}")
                      print("  deleted:", d["ok"], json.dumps(d["resp"].get("success", d.get("body", "")))[:120])
                      removed += 1
          print(f"removed {removed} legacy record(s)")
          PYEOF

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: "Post-deploy check: custom domains + live probe"
        # Custom domains are declared in wrangler.jsonc (routes: custom_domain),
        # so the deploy above attaches them; Cloudflare provisions the DNS
        # records itself. This step only verifies the result.
        run: |
          sleep 20
          for u in https://adam-ferguson.com/ https://www.adam-ferguson.com/; do
            echo "=== $u ==="
            curl -s -o /dev/null -w "status=%{http_code}\n" "$u" || echo "probe failed"
            curl -sI "$u" | grep -iE "cf-ray|^server" || true
          done
