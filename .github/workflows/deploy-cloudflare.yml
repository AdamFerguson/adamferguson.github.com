# Deploys the static build to Cloudflare Workers (static assets).
#
# The build output (dist/) ships as the Worker's `assets` namespace — served
# edge-cached from every PoP. Requests that match an asset never execute the
# Worker script; worker.js only runs for unmatched routes (404 → dist/404.html)
# and is the seam for future dynamic routes.
#
# Secrets (never in this repo — see GitHub → Settings → Secrets and variables):
#   CLOUDFLARE_API_TOKEN   API token, minimal scope: Account → Workers → Edit
#                         (a Pages-only token will NOT deploy; update the
#                         token's scopes if the deploy job fails on auth)
#   CLOUDFLARE_ACCOUNT_ID  your account UUID (cf-api.com/dashboard → account)
#
# Safety:
#   - The token is referenced via ${{ secrets.* }} only; GitHub masks it in logs.
#   - `wrangler` is a pinned devDependency (package-lock), not an unpinned npx fetch.
#   - The deploy job runs only on pushes to the default branch (master); pull
#     requests build but can never deploy.
#   - The job requests only `contents: read`.
#
# DNS cutover (one-time, in the cf-api.com dashboard — not done by this repo):
#   1. Deploy succeeds → the `adam-ferguson` Worker exists.
#   2. Zone adam-ferguson.com → DNS: change the `@` record to type **Workers**,
#      target `adam-ferguson`; `www` → CNAME `adam-ferguson.adam-ferguson.workers.dev`
#      (both proxied). Cloudflare provisions the certificate automatically.
#   3. Verify, then the legacy Cloudflare Pages project can be deleted.
#      Rollback until then: point the DNS record back at the Pages project.

name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Validate resume YAML
        run: npm run validate:resume

      - name: Build
        run: npm run build

      - name: Render résumé PDF and DOCX
        run: |
          npx playwright install --with-deps chromium
          npm run pdf
          # DOCX is rendered via pandoc. The ubuntu runner image no longer
          # ships it, so install the apt package first (printed for diagnosing
          # version issues).
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc
          pandoc --version
          npm run docx

      - name: Copy résumé files into build output
        # Both are rendered into public/ after the build ran; copy them into
        # dist/ so they're part of the deploy (served at /AdamFerguson-Resume.pdf
        # and /AdamFerguson-Resume.docx).
        run: |
          cp public/AdamFerguson-Resume.pdf dist/AdamFerguson-Resume.pdf
          cp public/AdamFerguson-Resume.docx dist/AdamFerguson-Resume.docx

      - name: Verify dist output
        run: |
          test -f dist/index.html
          test -f dist/resume/index.html
          test -f dist/AdamFerguson-Resume.pdf
          test -f dist/AdamFerguson-Resume.docx
          echo "dist verified"

      - name: Design-system gate (token audit)
        # Deterministic: raw colors outside themes.css, Tier-1 token leaks,
        # unevaluated calls in built HTML, WCAG contrast. Fails the deploy on violation.
        run: node .pi/skills/website-design/scripts/token-audit.mjs

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    steps:
      - name: Checkout
        # Required so wrangler.jsonc + worker.js exist; without them wrangler
        # falls back to onboarding defaults (first deploy landed on a stray
        # worker named after the checkout directory).
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install dependencies
        # Uses the pinned wrangler from package-lock, not an unpinned npx fetch.
        run: npm ci

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Remove stray 'adamferguson-github-com' worker (one-time, idempotent)
        # Leftover from the first unconfigured deploy. 404 = already gone.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -fsS -X DELETE \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/adamferguson-github-com" \
            || echo "nothing to clean up"

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Cutover: attach adam-ferguson.com + www to the Worker (one-time)
        # Runs after the deploy so the Worker exists before its domains attach.
        # Prints the API response for each hostname so the outcome is visible
        # in the log. If a hostname is still claimed by the legacy DNS records,
        # the API refuses — in that case the old records move (see workflow
        # header) and this step is re-run.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for h in adam-ferguson.com www.adam-ferguson.com; do
            echo "=== attach $h ==="
            curl -sS -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"hostname\": \"$h\"}" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" | head -c 800
            echo
          done
          sleep 15
          echo "=== live check: https://adam-ferguson.com ==="
          curl -s -o /dev/null -w "status=%{http_code}\n" https://adam-ferguson.com/ || true
          curl -sI https://adam-ferguson.com/ | grep -iE "cf-ray|^server" || true
