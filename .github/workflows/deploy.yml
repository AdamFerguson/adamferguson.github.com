name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main, redesign]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# Permission to deploy to GitHub Pages (and read contents).
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Validate resume YAML
        run: npm run validate:resume

      - name: Build
        run: npm run build

      - name: Render resume PDF
        run: |
          npx playwright install --with-deps chromium
          npm run pdf

      - name: Verify dist output
        run: |
          test -f dist/index.html
          test -f dist/resume/index.html
          test -f dist/AdamFerguson-Resume.pdf
          echo "dist verified"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
